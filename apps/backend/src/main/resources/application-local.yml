spring:
  datasource:
    url: jdbc:h2:mem:geoeconwars;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

logging:
  level:
    com.geoeconwars: DEBUG
